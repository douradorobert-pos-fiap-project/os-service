name: pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
      - run: poetry install --no-interaction
      - run: bash scripts/quality.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports-${{ github.event.repository.name }}
          path: reports/
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image for pull request
        if: github.event_name == 'pull_request'
        run: docker build --tag ${{ github.event.repository.name }}:${{ github.sha }} .
      - uses: aws-actions/configure-aws-credentials@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        if: github.event_name == 'workflow_dispatch'
        id: ecr
      - name: Publish immutable image
        if: github.event_name == 'workflow_dispatch'
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          REPOSITORY="${{ github.event.repository.name }}"
          TAGGED_IMAGE="$REGISTRY/$REPOSITORY:${{ github.sha }}"
          docker build --tag "$TAGGED_IMAGE" .
          docker push "$TAGGED_IMAGE"
          DIGEST="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag=${{ github.sha }} --query 'imageDetails[0].imageDigest' --output text)"
          echo "uri=$REGISTRY/$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: container
    if: github.event_name == 'workflow_dispatch'
    environment: sandbox
    env:
      RDS_ENDPOINT: ${{ vars.RDS_ENDPOINT }}
      DB_PORT: ${{ vars.DB_PORT }}
      OS_DATABASE: ${{ vars.OS_DATABASE }}
      OS_DATABASE_USERNAME: ${{ vars.OS_DATABASE_USERNAME }}
      OS_DB_PASSWORD: ${{ secrets.OS_DB_PASSWORD }}
      NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"
      - name: Synchronize runtime secrets
        run: bash scripts/sync-k8s-secrets.sh
      - name: Apply service configuration
        run: kubectl apply -f k8s/configmap.yaml -f k8s/service.yaml
      - name: Run database migrations
        env:
          IMAGE: ${{ needs.container.outputs.image }}
        run: |
          kubectl -n oficina delete job/os-service-migration --ignore-not-found
          sed "s|image: .*tech-challenge-fiap-os-service.*|image: $IMAGE|" k8s/migration-job.yaml | kubectl apply -f -
          kubectl -n oficina wait --for=condition=complete job/os-service-migration --timeout=180s
          kubectl -n oficina logs job/os-service-migration
      - name: Deploy immutable image after migrations
        env:
          IMAGE: ${{ needs.container.outputs.image }}
        run: |
          sed "s|image: .*tech-challenge-fiap-os-service.*|image: $IMAGE|" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/hpa.yaml
          kubectl -n oficina rollout status deployment/os-service --timeout=180s

